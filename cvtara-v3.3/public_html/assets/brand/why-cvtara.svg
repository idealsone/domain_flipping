<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="Inter,Segoe UI,Arial,sans-serif"><title id="t">Why CVTara</title><desc id="d">Upload, score, match, tailor and track: the CVTara job-search flow.</desc><rect width="1200" height="520" rx="28" fill="#f4f7fd"/><text x="600" y="62" text-anchor="middle" font-size="30" font-weight="800" fill="#12203d">One workspace from resume to offer</text><text x="600" y="96" text-anchor="middle" font-size="17" fill="#51607f">Most tools do one step. CVTara connects all five.</text><rect x="40" y="140" width="208" height="230" rx="20" fill="#fff" stroke="#d7deea"/><circle cx="144" cy="190" r="28" fill="#1557d2"/><text x="144" y="199" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">1</text><text x="144" y="252" text-anchor="middle" font-size="24" font-weight="800" fill="#12203d">Upload</text><text x="144" y="290" text-anchor="middle" font-size="16" fill="#51607f">Bring the resume you</text><text x="144" y="314" text-anchor="middle" font-size="16" fill="#51607f">have: Word, PDF or</text><text x="144" y="338" text-anchor="middle" font-size="16" fill="#51607f">text</text><path d="M252 255 l16 0" stroke="#9aa8c4" stroke-width="3" stroke-linecap="round"/><rect x="272" y="140" width="208" height="230" rx="20" fill="#fff" stroke="#d7deea"/><circle cx="376" cy="190" r="28" fill="#0d9488"/><text x="376" y="199" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">2</text><text x="376" y="252" text-anchor="middle" font-size="24" font-weight="800" fill="#12203d">Score</text><text x="376" y="290" text-anchor="middle" font-size="16" fill="#51607f">See an ATS-friendly</text><text x="376" y="314" text-anchor="middle" font-size="16" fill="#51607f">score out of 100</text><path d="M484 255 l16 0" stroke="#9aa8c4" stroke-width="3" stroke-linecap="round"/><rect x="504" y="140" width="208" height="230" rx="20" fill="#fff" stroke="#d7deea"/><circle cx="608" cy="190" r="28" fill="#7c3aed"/><text x="608" y="199" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">3</text><text x="608" y="252" text-anchor="middle" font-size="24" font-weight="800" fill="#12203d">Match</text><text x="608" y="290" text-anchor="middle" font-size="16" fill="#51607f">Check it against the</text><text x="608" y="314" text-anchor="middle" font-size="16" fill="#51607f">job and see what is</text><text x="608" y="338" text-anchor="middle" font-size="16" fill="#51607f">missing</text><path d="M716 255 l16 0" stroke="#9aa8c4" stroke-width="3" stroke-linecap="round"/><rect x="736" y="140" width="208" height="230" rx="20" fill="#fff" stroke="#d7deea"/><circle cx="840" cy="190" r="28" fill="#ea580c"/><text x="840" y="199" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">4</text><text x="840" y="252" text-anchor="middle" font-size="24" font-weight="800" fill="#12203d">Tailor</text><text x="840" y="290" text-anchor="middle" font-size="16" fill="#51607f">One click makes a</text><text x="840" y="314" text-anchor="middle" font-size="16" fill="#51607f">version for that job</text><path d="M948 255 l16 0" stroke="#9aa8c4" stroke-width="3" stroke-linecap="round"/><rect x="968" y="140" width="208" height="230" rx="20" fill="#fff" stroke="#d7deea"/><circle cx="1072" cy="190" r="28" fill="#16a34a"/><text x="1072" y="199" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">5</text><text x="1072" y="252" text-anchor="middle" font-size="24" font-weight="800" fill="#12203d">Track</text><text x="1072" y="290" text-anchor="middle" font-size="16" fill="#51607f">Applications and</text><text x="1072" y="314" text-anchor="middle" font-size="16" fill="#51607f">reminders in one place</text><circle cx="80" cy="440" r="13" fill="#16a34a"/><path d="M74 440 l4 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="446" font-size="18" font-weight="700" fill="#12203d">Clear reasons, not guesses</text><circle cx="450" cy="440" r="13" fill="#16a34a"/><path d="M444 440 l4 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="474" y="446" font-size="18" font-weight="700" fill="#12203d">Pay once, no auto-renewal</text><circle cx="820" cy="440" r="13" fill="#16a34a"/><path d="M814 440 l4 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="844" y="446" font-size="18" font-weight="700" fill="#12203d">Built by an HR team in Bangalore</text></svg>