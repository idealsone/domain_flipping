<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title></head><body><div id="cvl" style="font:15px system-ui;padding:24px;color:#334155">Loading CVTara preview…</div>
<script>
(function(){
var ROLE=__ROLE__,PAGE="__PAGE__";
// storage can throw inside sandboxed frames: fall back to memory
['localStorage','sessionStorage'].forEach(function(k){try{window[k].getItem('x')}catch(e){var m={};try{Object.defineProperty(window,k,{configurable:true,value:{getItem:function(a){return a in m?m[a]:null},setItem:function(a,v){m[a]=String(v)},removeItem:function(a){delete m[a]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null},get length(){return Object.keys(m).length}}})}catch(e2){}}});
var href=location.href.split('#')[0].split('?')[0];
var cands=[];function add(u){try{u=new URL(u,location.href).href}catch(e){return}if(cands.indexOf(u)<0)cands.push(u)}
add('./');add(href.replace(/\/?$/,'/'));add(href.replace(/[^\/]*$/,''));add(location.origin+'/');
var tried=[];
function probe(i){
  if(i>=cands.length){document.getElementById('cvl').innerHTML='Could not locate the preview files.<br>Tried:<br>'+tried.join('<br>');return}
  var b=cands[i];
  fetch(b+'mock-api.js?v=__BUILD__').then(function(r){return r.text()}).then(function(t){
    if(t.indexOf('CVTara browser-only demo')<0){tried.push(b+' (not found)');return probe(i+1)}
    window.__BASE=b;load(['snap.js','pages.js','mock-api.js'],0)
  }).catch(function(e){tried.push(b+' ('+e.message+')');probe(i+1)});
}
function load(list,i){
  if(i>=list.length){try{__cvm.start(ROLE,PAGE)}catch(e){document.getElementById('cvl').textContent='Start error: '+e.message}return}
  var s=document.createElement('script');s.src=window.__BASE+list[i]+'?v=__BUILD__';s.onload=function(){load(list,i+1)};s.onerror=function(){document.getElementById('cvl').textContent='Failed to load '+list[i]};document.head.appendChild(s);
}
probe(0);
})();
</script></body></html>
